spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: YOUR_CLIENT_ID
            client-secret: YOUR_CLIENT_SECRET
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
      provider:
        keycloak:
          issuer-uri: http://localhost:8180/realms/my-realm


server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: true
        same-site: lax
      timeout: 30m


//Important: For local HTTP development, set secure: false. In production, use HTTPS and secure: true.